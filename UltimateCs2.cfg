// ========================================================================= //
// = CS2 ULTIMATE COMBINED PRACTICE & INSTANT SPAWN SELECTION MONOLITH
// = Combines: Server Lineup Tuning Rules + 4-Axis Map/Side/Spawn Selection Tree
// ========================================================================= //


// ========================================================================= //
// [SECTION 1] HARD HARDWARE KEY DEPLOYMENTS & SHORTCUTS
// ========================================================================= //
// Environment Keybinds
bind "B"          "noclip"
bind "N"          "sv_rethrow_last_grenade"
bind "O"          "add_frozen_bot"
bind "L"          "place_frozen_bot"
bind "I"          "bot_kick; say_team [CONFIG] All bots cleared from the map!"
bind "P"          "mp_restartgame 1"
bind "Y"          "say_team Type show_help in console to see Menu"

// Interactive Spawn-Tree Navigation Keys
bind "UPARROW"    "next_map"
bind "DOWNARROW"  "toggle_side"
bind "RIGHTARROW" "cycle_spawns"
bind "LEFTARROW"  "cycle_spawns_rev"

// ========================================================================= //
// [SECTION 2] REBUILT CONSOLE HELP DEPLOYMENT (WORKING FOR CS2)
// ========================================================================= //
// Broken into individual safe aliases to bypass the CS2 string length limit
alias "h1" "echo ========================================================="
alias "h2" "echo                --- CONFIG CONTROL PANEL ---              "
alias "h3" "echo ========================================================="
alias "h4" "echo   [UPARROW]    -> Cycle Active Maps (Defaults to T)      "
alias "h5" "echo   [DOWNARROW]  -> Toggle Active Sides (CT <-> T)        "
alias "h6" "echo   [RIGHTARROW] -> Teleport Next Spawn Lineup             "
alias "h7" "echo   [LEFTARROW]  -> Teleport Previous Spawn Lineup         "
alias "h8" "echo   [B] Key      -> Toggle Noclip Flying                   "
alias "h9" "echo   [N] Key      -> Rethrow Last Practice Grenade          "
alias "h0" "echo   [O] Key      -> Place Bot at Crosshair Intersection    "
alias "ha" "echo   [P] Key      -> Execute Instant Practice Round Restart "
alias "hb" "echo ========================================================="

alias "show_help" "echo ""; h1; h2; h3; h4; h5; h6; h7; h8; h9; h0; ha; hb; echo 

// ========================================================================= //
// [SECTION 3] PRACTICE ENVIRONMENT ENGINE RULES
// ========================================================================= //
sv_cheats 1;
bot_kick;

// Match Economic Infrastructure
mp_limitteams 0;
mp_autoteambalance 0;
mp_maxmoney 60000;
mp_startmoney 60000;
mp_buytime 9999;
mp_buy_anywhere 1;

// Round Time Parameters
mp_freezetime 0;
mp_roundtime 60;
mp_roundtime_defuse 60;
mp_respawn_on_death_ct 1;
mp_respawn_on_death_t 1;

// Ballistic & Grenade Utilities
sv_infinite_ammo 1;
sv_showimpacts 1;
sv_showimpacts_time 10;
ammo_grenade_limit_total 5;
sv_regeneration_force_on 1; 

// Grenade Trajectory Tracking Models
sv_grenade_trajectory_prac_trailtime 15;
sv_grenade_trajectory_time_spectator 15;
sv_grenade_trajectory_prac_pipreview 1;

// Cycle Match Execution
mp_warmup_end;
mp_restartgame 1;

// ========================================================================= //
// [SECTION 4] REBUILT SAFE BOT GENERATION ARCHITECTURE
// ========================================================================= //
alias "add_frozen_bot"   "bot_add; bot_stop 1; bot_freeze 1; say_team [WARNING] DO NOT aim at feet or use in NOCLIP during Placement!! Move, Aim where you want the bot, and press L to place."
alias "place_frozen_bot" "bot_place; say_team [CONFIG] Bot locked to your crosshair safely! Press I to clear all Bots"

// Safe sequential execution toggles
alias "spawn_bot_sequence" "add_frozen_bot; alias spawn_bot_sequence snap_bot_to_me"
alias "snap_bot_to_me"     "place_frozen_bot; alias spawn_bot_sequence spawn_bot_sequence"

// ========================================================================= //
// [SECTION 5] GLOBAL VISUAL ACKNOWLEDGEMENT STRINGS
// ========================================================================= //
alias "SayTSide"        "say_team [SIDE CHANGER] -> T Side loaded."
alias "SayCTSide"       "say_team [SIDE CHANGER] -> CT Side loaded."

alias "SayMapMirage"    "say_team [MAP CHANGER] -> Active Map: Mirage."
alias "SayMapAncient"   "say_team [MAP CHANGER] -> Active Map: Ancient."
alias "SayMapInferno"   "say_team [MAP CHANGER] -> Active Map: Inferno."
alias "SayMapNuke"      "say_team [MAP CHANGER] -> Active Map: Nuke."
alias "SayMapAnubis"    "say_team [MAP CHANGER] -> Active Map: Anubis."
alias "SayMapCache"     "say_team [MAP CHANGER] -> Active Map: Cache."


